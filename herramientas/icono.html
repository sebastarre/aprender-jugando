<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ícono de Aprender Jugando</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #lienzo { width: 512px; height: 512px; }
</style>
</head>
<body>
<!-- Página que dibuja el ícono de la app. La usa herramientas/generar-iconos.js
     para sacarle una captura; también se puede abrir a mano para verla.
     Parámetros: ?lado=192 cambia el tamaño, ?relleno=0.16 deja el margen seguro
     que pide el ícono "maskable" de Android, ?recto=1 saca las esquinas
     redondeadas (iOS las redondea solo). -->
<div id="lienzo"></div>
<script src="../js/datos/geografia.js"></script>
<script>
var params = new URLSearchParams(location.search);
var RELLENO = parseFloat(params.get('relleno') || '0');
var RECTO = params.get('recto') === '1';
var LADO = parseInt(params.get('lado') || '512', 10);
var CENTRO = LADO / 2;
var R = (LADO / 2) * (1 - RELLENO) * 0.86;
var k = LADO / 512;                       // los grosores acompañan al tamaño

/* Proyección ortográfica (un globo de verdad) centrada en América. */
var LON0 = -68 * Math.PI / 180;
var LAT0 = 12 * Math.PI / 180;
var sinLat0 = Math.sin(LAT0), cosLat0 = Math.cos(LAT0);

function proyectar(lonGrados, latGrados) {
  var lam = lonGrados * Math.PI / 180 - LON0;
  var phi = latGrados * Math.PI / 180;
  var cosPhi = Math.cos(phi), sinPhi = Math.sin(phi);
  var cosC = sinLat0 * sinPhi + cosLat0 * cosPhi * Math.cos(lam);
  var x = cosPhi * Math.sin(lam);
  var y = cosLat0 * sinPhi - sinLat0 * cosPhi * Math.cos(lam);
  if (cosC < 0) {                         // cara oculta: se apoya sobre el horizonte
    var n = Math.hypot(x, y) || 1;
    x /= n; y /= n;
  }
  return [CENTRO + x * R, CENTRO - y * R];
}

var tierras = '';
Object.keys(window.GEO_MUNDO).forEach(function (clave) {
  if (clave === '~010') return;           // la Antártida no aporta nada acá
  window.GEO_MUNDO[clave].p.forEach(function (anillo) {
    var d = '';
    for (var i = 0; i < anillo.length; i++) {
      var xy = proyectar(anillo[i][0], anillo[i][1]);
      d += (d ? 'L' : 'M') + xy[0].toFixed(1) + ' ' + xy[1].toFixed(1);
    }
    if (d.length > 24) tierras += d + 'Z';
  });
});

var radio = (RECTO || RELLENO) ? 0 : LADO * 0.22;
var partes = [
  '<svg width="' + LADO + '" height="' + LADO + '" viewBox="0 0 ' + LADO + ' ' + LADO + '" xmlns="http://www.w3.org/2000/svg">',
  '<defs>',
    '<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">',
      '<stop offset="0" stop-color="#5b7cfa"/><stop offset="1" stop-color="#8b5cf6"/>',
    '</linearGradient>',
    '<radialGradient id="brillo" cx="0.34" cy="0.3" r="0.75">',
      '<stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>',
      '<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>',
    '</radialGradient>',
    '<clipPath id="globo"><circle cx="' + CENTRO + '" cy="' + CENTRO + '" r="' + R + '"/></clipPath>',
  '</defs>',
  '<rect width="' + LADO + '" height="' + LADO + '" rx="' + radio + '" fill="url(#fondo)"/>',
  '<circle cx="' + CENTRO + '" cy="' + CENTRO + '" r="' + (R + 13 * k) + '" fill="#ffffff" opacity=".95"/>',
  '<circle cx="' + CENTRO + '" cy="' + CENTRO + '" r="' + R + '" fill="#bfe0f5"/>',
  '<g clip-path="url(#globo)">',
    '<path d="' + tierras + '" fill="#7cc05a" stroke="#57933b" stroke-width="' + (1.4 * k).toFixed(2) + '" stroke-linejoin="round"/>',
  '</g>',
  '<circle cx="' + CENTRO + '" cy="' + CENTRO + '" r="' + R + '" fill="url(#brillo)"/>',
  '<circle cx="' + CENTRO + '" cy="' + CENTRO + '" r="' + R + '" fill="none" stroke="#2f4a8a" stroke-opacity=".22" stroke-width="' + (3 * k).toFixed(2) + '"/>',
  '</svg>'
];

var lienzo = document.getElementById('lienzo');
lienzo.style.width = lienzo.style.height = LADO + 'px';
lienzo.innerHTML = partes.join('');
document.title = 'icono-listo-' + LADO;
</script>
</body>
</html>
