<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ícono de Bichito Curioso</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  @font-face {
    /* el mismo nombre que en la app; en los atributos del SVG va entre
       comillas simples, porque sin comillas «Baloo 2» no es un nombre válido */
    font-family: 'Baloo 2';
    src: url('../assets/fuentes/baloo2.woff2') format('woff2');
    font-weight: 400 800;
  }
</style>
</head>
<body>
<!-- Página que dibuja el ícono de la app. La usa herramientas/generar-iconos.js
     para sacarle una captura; también se puede abrir a mano para verla.

     El ícono es la mascota —el gato disfrazado de león— asomándose por el
     borde de abajo, con un sol girasol atrás, sobre el cielo plano de la
     portada: es la misma escena de la tarjeta del inicio, así que lo que el
     chico toca en el celular y lo primero que ve adentro son lo mismo. Sin
     degradados ni destellos, como el resto de la app (ver DESIGN.md).

     Parámetros:
       ?lado=192       el tamaño
       ?relleno=0.16   el margen seguro del ícono «maskable» de Android
       ?recto=1        sin esquinas redondeadas (iOS las redondea solo)
       ?compartir=1    la tarjeta de 1200×630 que se ve al compartir el link
       ?ancho=&alto=   la tarjeta en otro tamaño (Google Play pide 1024×500) -->
<div id="lienzo"></div>
<script src="../js/nucleo/mascota.js"></script>
<script>
var params = new URLSearchParams(location.search);
var COMPARTIR = params.get('compartir') === '1';
var RELLENO = parseFloat(params.get('relleno') || '0');
var RECTO = params.get('recto') === '1';
var LADO = parseInt(params.get('lado') || '512', 10);
var ANCHO = COMPARTIR ? 1200 : LADO;
var ALTO = COMPARTIR ? 630 : LADO;
/* ?ancho=1024&alto=500 dibuja la tarjeta en otro tamaño (el gráfico
   destacado de Google Play), recortando arriba y abajo lo que sobre */
var SALIDA_ANCHO = parseInt(params.get('ancho') || ANCHO, 10);
var SALIDA_ALTO = parseInt(params.get('alto') || ALTO, 10);

/* La mascota la dibuja js/nucleo/mascota.js, en un lienzo de 200×250.
   La cabeza (con la melena) va de x=11 a 189 y de y=9 a 187, con el
   centro en (100, 98). */
var IMG = { ancho: 200, alto: 250, cabeza: 178, cx: 100, cy: 98 };

var radio = (RECTO || RELLENO || COMPARTIR) ? 0 : LADO * 0.22;

function mascota(anchoCabeza, cx, cy) {
  var s = anchoCabeza / IMG.cabeza;
  var x = cx - IMG.cx * s, y = cy - IMG.cy * s;
  // el mismo dibujo de la app, metido como un SVG adentro del ícono
  return Mascota.svg('gato', 'leon', 'hola').replace('<svg class="mascota-img"',
    '<svg x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +
    '" width="' + (IMG.ancho * s).toFixed(1) + '" height="' + (IMG.alto * s).toFixed(1) + '"');
}

// los colores de la portada: el cielo y el sol (DESIGN.md, «cielo» y «girasol»)
var CIELO = '#1E90E0', SOL = '#FFC93C';

var partes = [
  '<svg width="' + SALIDA_ANCHO + '" height="' + SALIDA_ALTO + '" viewBox="0 0 ' + ANCHO + ' ' + ALTO +
    '" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">',
  '<defs>',
    '<clipPath id="recorte"><rect width="' + ANCHO + '" height="' + ALTO + '" rx="' + radio + '"/></clipPath>',
  '</defs>',
  '<g clip-path="url(#recorte)">',
  '<rect width="' + ANCHO + '" height="' + ALTO + '" fill="' + CIELO + '"/>'
];

if (COMPARTIR) {
  partes.push(
    '<circle cx="300" cy="250" r="230" fill="' + SOL + '"/>',
    mascota(360, 300, 290),
    '<text x="640" y="280" font-family="\'Baloo 2\', sans-serif" font-weight="800" font-size="104" fill="#ffffff">Bichito</text>',
    '<text x="640" y="380" font-family="\'Baloo 2\', sans-serif" font-weight="800" font-size="104" fill="#ffffff">Curioso</text>',
    '<text x="644" y="450" font-family="\'Baloo 2\', sans-serif" font-weight="600" font-size="34" fill="#ffffff">Juegos y lecciones para chicos</text>',
    '<text x="644" y="494" font-family="\'Baloo 2\', sans-serif" font-weight="600" font-size="34" fill="#ffffff" opacity=".9">de 4 a 12 años</text>'
  );
} else {
  /* La cabeza ocupa el 78% del ícono (menos en el maskable, que Android
     recorta en círculo) y el cuerpo se sale por abajo: se asoma. */
  var util = 1 - RELLENO;
  partes.push(
    /* el sol asomado arriba a la derecha, atrás de la melena: la misma
       escena de la tarjeta del inicio */
    '<circle cx="' + LADO * (0.5 + 0.24 * util) + '" cy="' + LADO * (0.5 - 0.26 * util) + '" r="' + LADO * 0.3 * util + '" fill="' + SOL + '"/>',
    mascota(LADO * 0.78 * util, LADO / 2, LADO * (0.5 - 0.06 * util))
  );
}
partes.push('</g></svg>');

document.getElementById('lienzo').innerHTML = partes.join('');
</script>
</body>
</html>
